
name: .NET Build and Tests

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'

  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore apps/message-microservice/src/MessageMicroservice/MessageMicroservice.sln

      - name: Build solution
        run: dotnet build apps/message-microservice/src/MessageMicroservice/MessageMicroservice.sln --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test apps/message-microservice/src/MessageMicroservice/MessageMicroservice.sln --configuration Release --no-build
