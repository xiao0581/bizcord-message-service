
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Fluentd sidecar for centralized logging.
  fluentd:
    image: fluent/fluentd:latest
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
    environment:
      FLUENTD_CONF: fluent.conf
    logging:
      driver: "json-file"

  message-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMQ__Host: rabbitmq
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: "${VAULT_TOKEN:?Set VAULT_TOKEN in PowerShell first}"
    depends_on:
      rabbitmq:
        condition: service_healthy
      fluentd:
        condition: service_started
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "bizcord.message-service"
    networks:
      - default
      - vault-network

networks:
  vault-network:
    external: true
    name: bizcord-vault-network
